  <path d="M0 39C50 39 150 54 300 54S510 24 660 24 850 54 1000 54 1030 18 1200 18"
        stroke="url(#glow)" stroke-width="3.2" stroke-linecap="round"
        stroke-dasharray="90 1110" filter="url(#soft)" opacity=".9">
    <animate attributeName="stroke-dashoffset"
             from="1200" to="0" dur="7s" repeatCount="indefinite"/>
  </path>

  <path d="M0 39C50 39 150 54 300 54S510 24 660 24 850 54 1000 54 1030 18 1200 18"
        stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round"
