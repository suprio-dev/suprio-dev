
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" fill="none">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#164E63" stop-opacity="0"/>
      <stop offset=".2" stop-color="#164E63"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset=".8" stop-color="#164E63"/>
      <stop offset="1" stop-color="#164E63" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="180" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-100%" width="140%" height="300%">
