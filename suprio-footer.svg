      path="M0 39C50 39 150 54 300 54S510 24 660 24 850 54 1000 54 1030 18 1200 18"/>
  </circle>

  <circle cx="600" cy="29" r="2" fill="#22D3EE" opacity=".85"/>
  <circle cx="600" cy="29" r="7" stroke="#22D3EE" stroke-opacity=".2"/>
