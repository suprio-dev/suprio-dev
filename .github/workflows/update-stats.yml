name: Update profile stats

on:
  schedule:
    - cron: "30 18 * * *"      # every day at 00:00 IST (18:30 UTC)
  workflow_dispatch:            # lets you run it manually from the Actions tab
  push:
    paths:
      - "scripts/generate_stats.py"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate animated stats SVGs
        env:
          GH_USER: suprio-dev
          # Optional: add a repo secret named STATS_TOKEN (a classic PAT with
          # read:user) to also count private contributions. Otherwise the
          # built-in token is used (public data only).
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats-streak.svg stats-overview.svg stats-heatmap.svg stats-runner.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update profile stats"
            git push
          fi
