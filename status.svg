<svg xmlns="http://www.w3.org/2000/svg" width="230" height="38" viewBox="0 0 230 38">
  <rect
    x="1"
    y="1"
    width="228"
    height="36"
    rx="18"
    fill="#22D3EE"
    fill-opacity="0.08"
    stroke="#22D3EE"
    stroke-opacity="0.5"
  />

  <circle
    cx="20"
    cy="19"
    r="5"
    fill="#22C55E"
  />

  <circle
    cx="20"
    cy="19"
    r="5"
    fill="none"
    stroke="#22C55E"
    stroke-width="2"
  >
    <animate
      attributeName="r"
      values="5;14"
      dur="1.6s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="0.8;0"
      dur="1.6s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="38"
    y="24"
    font-family="JetBrains Mono, Consolas, monospace"
    font-size="14"
    font-weight="600"
    fill="#0891B2"
  >Open to collaboration</text>
</svg>
