
<svg width="900" height="310" viewBox="0 0 900 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="900" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#818CF8;#A78BFA;#22D3EE" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#22D3EE;#818CF8;#6366F1" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#22D3EE;#6366F1;#A78BFA" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="surface" x1="0" y1="0" x2="900" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#090F1D"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop stop-color="#22D3EE" stop-opacity=".20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="clip">
      <rect x="2" y="2" width="896" height="306" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="310" fill="url(#surface)"/>

    <circle cx="730" cy="100" r="190" fill="url(#glow)" filter="url(#blur)"/>
    <circle cx="100" cy="280" r="150" fill="#6366F1" opacity=".08" filter="url(#blur)"/>

    <!-- Background grid -->
    <g stroke="#64748B" stroke-opacity=".10" stroke-width="1">
      <path d="M0 60H900M0 110H900M0 160H900M0 210H900M0 260H900"/>
      <path d="M100 0V310M200 0V310M300 0V310M400 0V310M500 0V310M600 0V310M700 0V310M800 0V310"/>
    </g>

    <!-- Floating particles -->
    <g fill="#22D3EE">
      <circle cx="770" cy="55" r="2">
        <animate attributeName="cy" values="55;40;55" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="840" cy="220" r="2">
        <animate attributeName="cy" values="220;205;220" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;.9;.2" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="660" cy="260" r="2">
        <animate attributeName="cy" values="260;245;260" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Main content -->
    <text x="55" y="57" fill="#22D3EE" font-family="monospace" font-size="12" letter-spacing="3">LET'S BUILD SOMETHING</text>

    <text x="55" y="112" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="36" font-weight="700">Connect &amp; Collaborate.</text>

    <text x="55" y="151" fill="#94A3B8" font-family="Arial, sans-serif" font-size="14">Good ideas become better when developers build together.</text>

    <text x="55" y="176" fill="#94A3B8" font-family="Arial, sans-serif" font-size="14">Open to open source, meaningful projects and new connections.</text>

    <!-- Status -->
    <rect x="55" y="205" width="190" height="34" rx="17" fill="#0F2928" stroke="#14B8A6" stroke-opacity=".5"/>
    <circle cx="73" cy="222" r="4" fill="#34D399">
      <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="86" y="226" fill="#6EE7B7" font-family="monospace" font-size="11">OPEN TO COLLABORATE</text>

    <!-- Right connection orbit -->
    <circle cx="730" cy="145" r="94" stroke="#64748B" stroke-opacity=".22" stroke-dasharray="4 7"/>
    <circle cx="730" cy="145" r="66" stroke="#22D3EE" stroke-opacity=".25" stroke-dasharray="3 6"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 730 145" to="360 730 145" dur="18s" repeatCount="indefinite"/>
      <circle cx="730" cy="51" r="6" fill="#22D3EE"/>
      <circle cx="824" cy="145" r="5" fill="#818CF8"/>
      <circle cx="730" cy="239" r="5" fill="#A78BFA"/>
      <circle cx="636" cy="145" r="5" fill="#22D3EE"/>
    </g>

    <circle cx="730" cy="145" r="42" fill="#17243A" stroke="#22D3EE" stroke-opacity=".55"/>
    <circle cx="730" cy="145" r="34" fill="#0F172A"/>

    <text x="730" y="151" fill="#22D3EE" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>

    <text x="730" y="275" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">IDEAS → CODE → IMPACT</text>

    <!-- Animated scan line -->
    <rect x="2" y="2" width="896" height="2" fill="url(#border)" opacity=".65">
      <animate attributeName="y" values="2;308;2" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Animated border -->
  <rect x="1" y="1" width="898" height="308" rx="20" stroke="url(#border)" stroke-width="1.5"/>
</svg>
