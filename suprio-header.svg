
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="100" viewBox="0 0 1200 100"
     fill="none">

  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#164E63" stop-opacity="0"/>
      <stop offset=".3" stop-color="#22D3EE" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#164E63" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M0 68 C180 12 290 92 460 55 S760 15 920 54 S1090 80 1200 28"
        stroke="#164E63" stroke-width="1.5" opacity=".55"/>

  <path d="M0 82 C180 26 290 106 460 69 S760 29 920 68 S1090 94 1200 42"
        stroke="#164E63" stroke-width="1" opacity=".35"/>

  <path d="M0 68 C180 12 290 92 460 55 S760 15 920 54 S1090 80 1200 28"
        stroke="url(#cyan)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-dasharray="180 1020"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
             values="1200;0"
             dur="8s"
             repeatCount="indefinite"/>
  </path>

  <g fill="#67E8F9">
    <circle cx="180" cy="45" r="1.8">
      <animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="35" r="1.5">
      <animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="55" r="1.8">
      <animate attributeName="opacity" values=".2;.9;.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
